[workspace]
resolver = "2"
members = [
  "crypto_hash_argon2",
  "crypto_hash_bcrypt",
  "crypto_hash_scrypt",
  "dom_domparser",
  "json_jsonpath"
]

[workspace.package]
version = "0.0.0"
edition = "2021"

[workspace.dependencies]
wasm-bindgen = "0.2.92"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.4"
serde_json = "1"
serde_json_path = "0.6"
getrandom = { version = "0.2", features = ["js"] }
rand_core = { version = "0.6", features = ["std"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "DomParser", "Node", "Element", "HtmlElement", "Text", "Comment", "DocumentFragment", "DocumentType", "Attr", "NamedNodeMap", "NodeList", "HtmlCollection", "DomTokenList", "HtmlHeadElement", "HtmlBodyElement", "HtmlTitleElement", "HtmlMetaElement", "HtmlLinkElement", "HtmlScriptElement", "HtmlStyleElement"] }
argon2 = "0.5"
bcrypt = "0.15"
scrypt = "0.11"
html5ever = "0.26"
markup5ever_rcdom = "0.2"
tendril = "0.4"
quick-xml = { version = "0.31", features = ["serialize"] }

[profile.release]
codegen-units = 1
incremental = true
lto = true
opt-level = "z"
