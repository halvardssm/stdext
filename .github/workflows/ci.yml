name: ci

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        deno:
          - v2.x
          - canary
        os:
          - ubuntu-latest
          - windows-latest
          - macOS-latest

    # Deno comes from setup-deno (the matrix includes canary, which mise
    # cannot install) and rust is preinstalled on the runner, so mise
    # manages neither and only runs the tasks.
    env:
      MISE_DISABLE_TOOLS: deno,rust

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno }}

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Run tests
        run: mise run test

      - name: Generate lcov
        run: mise run cov:gen

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          name: ${{ matrix.os }}-${{ matrix.deno }}

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Installs deno and rust from mise.toml.
      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Format & Lint
        run: mise run check

      - name: Build
        run: mise run build:wasm:check

  publish-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      # Installs deno and rust from mise.toml.
      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Publish (dry run)
        run: deno publish --dry-run
